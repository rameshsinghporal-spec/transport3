<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transport Services</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --gov-blue: #1a3c6e;
      --gov-light: #e9eef5;
      --gov-border: #cbd5e1;
    }

    body {
      margin: 0;
      padding-top: 80px;
      background: #f1f5f9;
      font-family: system-ui;
    }

    .nav-glass {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: #ffffff;
      border-bottom: 2px solid var(--gov-blue);
    }

    .logo-text {
      font-weight: 800;
      font-size: 20px;
      color: var(--gov-blue);
    }

    .service-strip {
      background: white;
      border: 1px solid var(--gov-border);
      border-radius: 10px;
      padding: 25px;
    }

    /* ✅ UPDATED BOX */
    .service-tile {
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      border: 1px solid var(--gov-border);
      color: white;
      transition: 0.3s ease;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ✅ SKY BLUE */
    .blue {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    }

    /* ✅ YELLOW */
    .yellow {
      background: linear-gradient(135deg, #fde047, #facc15);
      color: #111;
    }

    .section-box {
      background: white;
      border: 1px solid var(--gov-border);
      border-radius: 10px;
      padding: 20px;
    }

    .footer {
      background: #0b1220;
      color: white;
      margin-top: 40px;
    }

    a { text-decoration: none; color: inherit; }
  </style>
</head>

<body>

<nav class="navbar nav-glass">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <div class="logo-text">Transport Service</div>
    </div>
    <a href="enquiry.html" class="btn btn-primary">Apply Online</a>
  </div>
</nav>

<section class="container mt-3">
  <img src="images/advertisement_Test.jpg" style="width:100%; border-radius:6px;">
</section>

<div class="container mt-4">
  <div class="service-strip">
    
    <!-- ✅ UPDATED ROW -->
    <div class="row g-3 justify-content-center">

      <div class="col-md-6 col-lg-4">
        <div class="service-tile blue">
          <h5>Two Wheeler</h5>
          <a href="enquiry.html" class="btn btn-primary mt-2">Apply</a>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="service-tile yellow">
          <h5>Replacement / Retail / Transfer</h5>
          <a href="enquiry.html" class="btn btn-dark mt-2">Apply</a>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="service-tile blue">
          <h5>Four Wheeler</h5>
          <a href="enquiry.html" class="btn btn-primary mt-2">Apply</a>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="service-tile yellow">
          <h5>Three Wheeler</h5>
          <a href="enquiry.html" class="btn btn-dark mt-2">Apply</a>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="service-tile blue">
          <h5>Electric Vehicle</h5>
          <a href="enquiry.html" class="btn btn-primary mt-2">Apply</a>
        </div>
      </div>

      <div class="col-md-6 col-lg-4">
        <div class="service-tile yellow">
          <h5>Heavy Vehicle</h5>
          <a href="enquiry.html" class="btn btn-dark mt-2">Apply</a>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- BAQI SAB SAME RAKHA HAI -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
