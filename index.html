    :root {
      --brand: #0d6efd;
      --brand2: #0aa2c0;
      --ink: #0b1220;
      --muted: #475569;
      --soft: #f5f7fb;
      --card: #ffffff;
      --border: #e5e7eb;

      --radius: 18px;
    }

    body {
      margin: 0;
      padding-top: 72px;
      background: var(--soft);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

    .nav-glass {

      top: 0;
      left: 0;
      width: 100%;
      z-index: 1050;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      letter-spacing: .04em;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 10px 22px rgba(13, 110, 253, .25);
      flex: 0 0 auto;
    }

    .footer {
      margin-top: 24px;
      background: #0b1220;
      color: #fff;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
    }

    .footer a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .small-muted {
      color: rgba(255, 255, 255, .75);
      font-weight: 650;
    }
